<title>Zharyk — Find your opportunity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --lilac:#DCCFF5; --lemon:#F7EFA5; --bg:#FCFAFF; --text:#393341;
  --card:#FFFFFF; --border:#ECE5F7; --muted:#7A7188; --accent:#B79CE8;
  --accent-dark:#8F6FD6; --success:#8FCB9B; --danger:#E8A0A0; --warn:#F0C674;
  --shadow: 0 8px 24px rgba(150,120,200,0.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#221F2A; --text:#F1ECFA; --card:#2C2836; --border:#3B3648; --muted:#B4ABC4;
    --lilac:#4B3E6B; --lemon:#8C8352; --accent:#B79CE8; --accent-dark:#C9B4F2;
    --shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
}
:root[data-theme="dark"]{
  --bg:#221F2A; --text:#F1ECFA; --card:#2C2836; --border:#3B3648; --muted:#B4ABC4;
  --lilac:#4B3E6B; --lemon:#8C8352; --accent:#B79CE8; --accent-dark:#C9B4F2;
  --shadow: 0 8px 24px rgba(0,0,0,0.35);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;transition:background .2s;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px;}
.topbar{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--border);backdrop-filter:blur(6px);}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;max-width:1080px;margin:0 auto;gap:12px;flex-wrap:wrap;}
.logo{font-weight:800;font-size:22px;display:flex;align-items:center;gap:8px;}
nav.mainnav{display:flex;gap:4px;flex-wrap:wrap;}
nav.mainnav button{background:none;border:none;padding:8px 12px;border-radius:12px;font-weight:600;font-size:14px;color:var(--muted);}
nav.mainnav button.active{background:var(--lilac);color:var(--text);}
nav.mainnav button:hover{background:var(--border);}
.topright{display:flex;align-items:center;gap:8px;}
.langtoggle{display:flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;}
.langtoggle button{border:none;background:var(--card);padding:6px 12px;font-size:13px;font-weight:700;color:var(--muted);}
.langtoggle button.active{background:var(--accent);color:#fff;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:14px;border:none;font-weight:700;font-size:14px;transition:transform .1s, box-shadow .1s;}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;box-shadow:0 6px 18px rgba(143,111,214,.35);}
.btn-primary:hover{box-shadow:0 8px 22px rgba(143,111,214,.5);}
.btn-lemon{background:var(--lemon);color:#393341;}
.btn-outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent-dark);}
.btn-ghost{background:var(--border);color:var(--text);}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:10px;}
.btn-danger{background:var(--danger);color:#5a1f1f;}
.btn-success{background:var(--success);color:#1f4a28;}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--lilac);color:var(--text);}
.pill-lemon{background:var(--lemon);}
.pill-muted{background:var(--border);color:var(--muted);}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);}
.section{padding:36px 0;}
.hero{background:linear-gradient(160deg,var(--lilac) 0%, var(--bg) 70%);border-radius:0 0 40px 40px;padding:56px 0 44px;}
.hero h1{font-size:38px;line-height:1.15;margin:0 0 14px;font-weight:800;}
.hero p{color:var(--muted);font-size:17px;max-width:600px;}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:32px;}
@media(max-width:800px){.steps{grid-template-columns:1fr 1fr;} .hero h1{font-size:28px;}}
.step-card{padding:20px;text-align:center;}
.step-num{width:36px;height:36px;border-radius:50%;background:var(--lemon);display:flex;align-items:center;justify-content:center;font-weight:800;margin:0 auto 10px;}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;margin-top:20px;}
.opp-card{padding:18px;display:flex;flex-direction:column;gap:8px;position:relative;transition:transform .15s, box-shadow .15s;}
.opp-card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(183,156,232,.28);}
.opp-title{font-weight:800;font-size:16px;line-height:1.3;}
.opp-meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--muted);}
.opp-badges{display:flex;flex-wrap:wrap;gap:6px;}
.save-btn{position:absolute;top:14px;right:14px;background:var(--bg);border:1px solid var(--border);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.save-btn.saved{background:var(--lemon);}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;}
select,input[type=text],input[type=search],input[type=date],input[type=email],input[type=password],textarea{
  background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--text);font-family:inherit;
}
textarea{width:100%;resize:vertical;}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:13px;font-weight:700;color:var(--muted);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:700px){.form-grid{grid-template-columns:1fr;}}
.page-title{font-size:26px;font-weight:800;margin:0 0 4px;}
.page-sub{color:var(--muted);margin:0 0 8px;}
.tabbar{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:20px;flex-wrap:wrap;}
.tabbar button{background:none;border:none;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;}
.tabbar button.active{color:var(--accent-dark);border-bottom:2px solid var(--accent-dark);}
.modal-bg{position:fixed;inset:0;background:rgba(30,20,50,.35);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;}
.modal{background:var(--card);border-radius:22px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;padding:26px;box-shadow:var(--shadow);}
.modal h2{margin-top:0;}
.close-x{position:absolute;top:16px;right:16px;background:var(--border);border:none;border-radius:50%;width:30px;height:30px;}
.progressbar{height:8px;background:var(--border);border-radius:99px;overflow:hidden;margin:14px 0;}
.progressbar-fill{height:100%;background:linear-gradient(90deg,var(--lemon),var(--accent));}
.match-card{padding:20px;display:flex;flex-direction:column;gap:8px;}
.match-pct{font-size:28px;font-weight:800;color:var(--accent-dark);display:flex;align-items:center;gap:7px;}
.avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--lilac),var(--lemon));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;margin:0 auto 10px;}
.glossary-term{padding:16px;margin-bottom:10px;}
.glossary-term h4{margin:0 0 4px;display:flex;align-items:center;gap:7px;}
.glossary-term p{margin:2px 0;color:var(--muted);font-size:14px;}
.mentor-card{padding:18px;text-align:center;transition:transform .15s, box-shadow .15s;}
.mentor-card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(183,156,232,.28);}
.deadline-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);}
.deadline-row:last-child{border-bottom:none;}
.empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
.status-tag{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;}
.status-pending{background:var(--warn);color:#5a4300;}
.status-approved{background:var(--success);color:#1f4a28;}
.status-rejected{background:var(--danger);color:#5a1f1f;}
.status-Saved{background:var(--border);}
.status-Preparing{background:var(--lemon);}
.status-Applied{background:var(--lilac);}
.status-Accepted{background:var(--success);color:#1f4a28;}
.status-Rejected{background:var(--danger);color:#5a1f1f;}
.footer{padding:40px 0;text-align:center;color:var(--muted);font-size:13px;}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px;}
@media(max-width:600px){.stat-grid{grid-template-columns:1fr;}}
.stat-box{padding:22px;text-align:center;}
.stat-num{font-size:30px;font-weight:800;color:var(--accent-dark);}
.proto-badge{display:inline-block;margin-top:10px;background:var(--warn);color:#5a4300;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;}
.linktabs{display:flex;gap:8px;margin-bottom:16px;}
.linktabs button{flex:1;padding:12px;border-radius:14px;border:1.5px solid var(--border);background:var(--card);font-weight:700;}
.linktabs button.active{border-color:var(--accent);background:var(--lilac);}
.helper-text{font-size:12px;color:var(--muted);margin-top:-8px;margin-bottom:10px;}
.center{display:flex;align-items:center;justify-content:center;}
.loading-dots::after{content:'...';}
table.admin-table{width:100%;border-collapse:collapse;font-size:13px;}
table.admin-table th, table.admin-table td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
.reqbox{white-space:pre-wrap;font-size:13px;color:var(--muted);}
.scroll-x{overflow-x:auto;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:14px;font-size:14px;font-weight:600;z-index:300;box-shadow:var(--shadow);}
.mini{font-size:12px;color:var(--muted);}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.post-img{width:100%;height:150px;object-fit:cover;border-radius:14px;margin-bottom:10px;display:block;}
.post-img-preview{width:100%;max-height:160px;object-fit:cover;border-radius:12px;margin-top:8px;display:none;}

/* ===== Zharyk light motif ===== */
.bulb-icon{flex-shrink:0;}
.brand-bulb{display:inline-flex;color:var(--accent-dark);filter:drop-shadow(0 0 5px rgba(183,156,232,.6));}
.btn .bulb-icon{opacity:.95;}
.empty-bulb{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle,var(--lilac) 0%, transparent 72%);margin:0 auto 10px;color:var(--accent-dark);opacity:.8;}
.match-bulb{transition:color .2s;}
.match-bulb.bulb-lit{color:var(--lemon);filter:drop-shadow(0 0 5px rgba(247,239,165,.85));}
.match-bulb.bulb-dim{color:var(--muted);opacity:.5;}
.glossary-term h4 .bulb-icon{color:var(--accent-dark);opacity:.85;}
.hero{position:relative;overflow:hidden;}
.hero .wrap{position:relative;z-index:1;}
.hero-decor{position:absolute;inset:0;pointer-events:none;z-index:0;}
.hero-rays{position:absolute;top:-50px;right:-50px;width:240px;height:240px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg, rgba(183,156,232,.4) 0deg 3deg, transparent 3deg 16deg);
  opacity:.4;}
.hero-bulb-watermark{position:absolute;top:22px;right:40px;color:var(--accent-dark);opacity:.14;}
.hero-glow-blob{position:absolute;border-radius:50%;filter:blur(40px);}
.hero-glow-blob.blob-1{width:260px;height:260px;background:radial-gradient(circle,var(--lemon),transparent 70%);top:-90px;right:-60px;opacity:.6;animation:zh-glow-pulse 7s ease-in-out infinite;}
.hero-glow-blob.blob-2{width:220px;height:220px;background:radial-gradient(circle,var(--accent),transparent 70%);bottom:-90px;left:-50px;opacity:.32;}
.sparkle-icon{position:absolute;color:var(--accent-dark);opacity:.5;}
.sparkle-icon.spark-1{top:16%;left:7%;color:var(--lemon);opacity:.8;}
.sparkle-icon.spark-2{top:62%;left:13%;opacity:.35;}
.sparkle-icon.spark-3{top:26%;right:14%;color:var(--lemon);opacity:.7;animation:zh-twinkle 4s ease-in-out infinite;}
.sparkle-icon.spark-4{bottom:18%;right:24%;opacity:.4;}
@keyframes zh-glow-pulse{0%,100%{opacity:.55;transform:scale(1);}50%{opacity:.78;transform:scale(1.08);}}
@keyframes zh-twinkle{0%,100%{opacity:.25;}50%{opacity:.85;}}
@media(max-width:800px){
  .hero-bulb-watermark, .hero-rays, .sparkle-icon.spark-2, .sparkle-icon.spark-4{display:none;}
  .hero-glow-blob{filter:blur(26px);}
  .hero-glow-blob.blob-1{width:170px;height:170px;top:-60px;right:-40px;}
  .hero-glow-blob.blob-2{width:150px;height:150px;}
}
@media (prefers-reduced-motion: reduce){
  .hero-glow-blob, .sparkle-icon{animation:none;}
}
</style>

/* ========================= STATE / SUPABASE DATA LAYER =========================
   DB is a local read cache, refreshed from Supabase at load and after each
   mutation. Every mutation function talks to Supabase first (respecting
   RLS), then updates this cache and re-renders. Shapes are kept identical
   to the original client-only version so the page-template functions below
   didn't need to change. */
let DB = { users:{}, opportunities:[], submissions:[], mentors:[], mentorRequests:[], posts:[], temirtauStats:{students:0,mentors:0}, userData:{} };
let SESSION_USER_ID = null;
let SESSION_USER_EMAIL = null;
let route = {name:'home', params:{}};

function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,10); }

function dbError(e){
  console.error(e);
  showToast(LANG==='ru' ? 'Ошибка базы данных: '+(e && e.message ? e.message : '') : 'Дерекқор қатесі: '+(e && e.message ? e.message : ''));
}

function ensureUserData(userId){
  if(!DB.userData[userId]) DB.userData[userId] = {saved:[], tracker:{}};
  return DB.userData[userId];
}

/* Fetch everything the current viewer is allowed to see (RLS-scoped) and
   rebuild the local cache. Called at init and after sign-in/out. */
async function refreshAllData(){
  const [oppsRes, mentorsRes, postsRes, statsRes] = await Promise.all([
    sb.from('opportunities').select('*').order('created_at', {ascending:false}),
    sb.from('mentors').select('*').order('created_at', {ascending:true}),
    sb.from('posts').select('*').order('created_at', {ascending:false}),
    sb.from('temirtau_stats').select('*').eq('id',1).maybeSingle()
  ]);
  if(oppsRes.error) dbError(oppsRes.error); else DB.opportunities = (oppsRes.data||[]).map(mapOpportunityFromDb);
  if(mentorsRes.error) dbError(mentorsRes.error); else DB.mentors = (mentorsRes.data||[]).map(mapMentorFromDb);
  if(postsRes.error) dbError(postsRes.error); else DB.posts = (postsRes.data||[]).map(mapPostFromDb);
  if(!statsRes.error && statsRes.data) DB.temirtauStats = {students:statsRes.data.students, mentors:statsRes.data.mentors};

  if(SESSION_USER_ID){
    const [subsRes, profilesRes, savedRes, trackerRes, mentorReqRes] = await Promise.all([
      sb.from('submissions').select('*').order('created_at', {ascending:false}),
      sb.from('profiles').select('*'),
      sb.from('saved_opportunities').select('opportunity_id').eq('user_id', SESSION_USER_ID),
      sb.from('application_tracker').select('opportunity_id,status').eq('user_id', SESSION_USER_ID),
      sb.from('mentor_requests').select('*').order('created_at', {ascending:false})
    ]);
    if(subsRes.error) dbError(subsRes.error); else DB.submissions = (subsRes.data||[]).map(mapSubmissionFromDb);
    if(!profilesRes.error){ DB.users = {}; (profilesRes.data||[]).forEach(p=>{ DB.users[p.id] = mapProfileFromDb(p); }); }
    const ud = ensureUserData(SESSION_USER_ID);
    ud.saved = (savedRes.data||[]).map(r=>r.opportunity_id);
    ud.tracker = {};
    (trackerRes.data||[]).forEach(r=>{ ud.tracker[r.opportunity_id] = r.status; });
    if(!mentorReqRes.error) DB.mentorRequests = (mentorReqRes.data||[]).map(mapMentorRequestFromDb);
  } else {
    DB.submissions = [];
    DB.users = {};
    DB.mentorRequests = [];
  }
}

/* ---- row <-> app-object mappers (snake_case DB columns <-> camelCase app fields) ---- */
function mapOpportunityFromDb(o){

function mapProfileFromDb(p){ return {id:p.id, email:p.email, name:p.name, role:p.role, grade:p.grade}; }

function currentUser(){
  if(!SESSION_USER_ID) return null;
  const profile = DB.users[SESSION_USER_ID] || null;
  if(profile) {
    if(isConfiguredAdminEmail(profile.email)) return Object.assign({}, profile, {role:'admin'});
    return profile;
  }
  // If the admin profile row is not available yet, still recognize the
  // authenticated Supabase account by its email.
  if(SESSION_USER_EMAIL && isConfiguredAdminEmail(SESSION_USER_EMAIL)){
    return {id:SESSION_USER_ID, email:SESSION_USER_EMAIL, name:'Admin', role:'admin', grade:null};
  }
  return null;
}

/* ========================= TOAST ========================= */
function showToast(msg){
  const holder = document.getElementById('toast-holder');
  const el = document.createElement('div');
  el.className='toast'; el.textContent = msg;
  holder.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 2600);
}

/* ========================= ROUTER ========================= */
function parseHash(){
  const h = location.hash.slice(1) || '/home';
  const parts = h.split('/').filter(Boolean);
  if(parts.length===0) return {name:'home', params:{}};
  if(parts[0]==='opportunity' && parts[1]) return {name:'opportunity', params:{id:parts[1]}};
  return {name:parts[0], params:{}};
}
window.addEventListener('hashchange', ()=>{ route = parseHash(); render(); window.scrollTo(0,0); });

function go(name, params){
  if(params && params.id) location.hash = '#/'+name+'/'+params.id;
  else location.hash = '#/'+name;
}

/* ========================= AUTH MODAL ========================= */
let authModal = null; // 'login' | 'register' | null
let authError = '';

function openAuth(mode){ authModal = mode; authError=''; renderModalLayer(); }
function closeAuth(){ authModal = null; renderModalLayer(); }

async function doLogin(email, password){
  if(!sb){ authError = LANG==='ru'?'Supabase не настроен (см. верх файла).':'Supabase бапталмаған.'; renderModalLayer(); return; }
  const cleanEmail = email.trim().toLowerCase();
  // The configured admin credentials still authenticate through Supabase;
  // this condition only grants the admin role to that exact account.
  const isConfiguredAdmin = cleanEmail === ADMIN_EMAIL && password === ADMIN_PASSWORD;
  const { data, error } = await sb.auth.signInWithPassword({ email: cleanEmail, password });

  if(error){ authError = t('invalid_login'); renderModalLayer(); return; }
  SESSION_USER_ID = data.user.id;
  SESSION_USER_EMAIL = (data.user.email || cleanEmail || '').toLowerCase();
  await refreshAllData();
  // Keep the explicit condition above documented and active for the configured admin account.
  if(isConfiguredAdmin && !isConfiguredAdminEmail(SESSION_USER_EMAIL)){
    authError = t('invalid_login');
    renderModalLayer();
    return;
  }
  closeAuth();
  render();
  const u = currentUser();
  showToast((LANG==='ru'?'Добро пожаловать, ':'Қош келдің, ')+(u? u.name : '')+'!');
}
async function doRegister(name, email, password, grade){
  if(!sb){ authError = LANG==='ru'?'Supabase не настроен (см. верх файла).':'Supabase бапталмаған.'; renderModalLayer(); return; }
  if(!name || !email || !password){ authError = t('fill_required'); renderModalLayer(); return; }
  const { data, error } = await sb.auth.signUp({
    email: email.trim(), password,
    options: { data: { name, grade: grade||null } }
  });
  if(error){
    authError = (error.message && error.message.toLowerCase().indexOf('already')>-1) ? t('email_taken') : error.message;
    renderModalLayer(); return;
  }
  if(!data.session){
    // Email confirmation is required by the Supabase project settings.
    closeAuth();
    showToast(LANG==='ru'?'Проверь почту и подтверди email, затем войди.':'Поштаңды тексеріп, email-ді растап, содан кейін кір.');
    return;
  }
  SESSION_USER_ID = data.user.id;
  await refreshAllData();
  closeAuth();
  render();
  showToast((LANG==='ru'?'Аккаунт создан!':'Аккаунт жасалды!'));
}
async function doLogout(){
  if(sb) await sb.auth.signOut();
  SESSION_USER_ID = null;
  SESSION_USER_EMAIL = null;
  await refreshAllData();
  go('home');
  showToast(LANG==='ru'?'Ты вышел из аккаунта':'Аккаунттан шықтың');
}

function requireAuth(){
  if(!currentUser()){ openAuth('login'); return false; }
  return true;
}

/* ========================= MODAL LAYER (auth + generic) ========================= */
let genericModal = null; // {title, bodyHtml, onMount}
function renderModalLayer(){
  const holder = document.getElementById('modal-layer') || (()=>{ const d=document.createElement('div'); d.id='modal-layer'; document.getElementById('root').appendChild(d); return d;})();
  if(authModal){
    holder.innerHTML = authModalHtml();
    bindAuthModalEvents();
  } else if(genericModal){
    holder.innerHTML = genericModalHtml();
  } else {
    holder.innerHTML = '';
  }
}
function authModalHtml(){
  const isLogin = authModal==='login';
  return `<div class="modal-bg" data-close="auth"><div class="card modal" style="position:relative">
    <button class="close-x" data-close="auth">✕</button>
    <h2>${isLogin? t('login_title') : t('register_title')}</h2>
    ${authError? `<p style="color:var(--danger);font-weight:700;font-size:13px;">${authError}</p>`:''}
    <div class="field"><label>${t('email')}</label><input type="email" id="auth-email"></div>
    ${!isLogin? `<div class="field"><label>${t('name_label')}</label><input type="text" id="auth-name"></div>
    <div class="field"><label>${t('filter_grade')}</label><select id="auth-grade"><option value="">-</option>${GRADES.map(g=>`<option value="${g}">${g}</option>`).join('')}</select></div>`:''}
    <div class="field"><label>${t('password')}</label><input type="password" id="auth-password"></div>
    <button class="btn btn-primary" id="auth-submit" style="width:100%;justify-content:center;margin-top:6px;">${isLogin? t('login') : t('register')}</button>
    <p class="mini" style="margin-top:14px;text-align:center;">
      ${isLogin? t('no_account') : t('have_account')}
      <a href="#" id="auth-switch" style="color:var(--accent-dark);font-weight:700;">${isLogin? t('register') : t('login')}</a>
    </p>
  </div></div>`;
}
function bindAuthModalEvents(){
  const holder = document.getElementById('modal-layer');
  holder.querySelectorAll('[data-close="auth"]').forEach(el=>el.addEventListener('click',(e)=>{ if(e.target===el) closeAuth(); }));
  const submit = document.getElementById('auth-submit');
  if(submit) submit.addEventListener('click', async ()=>{
    const email = document.getElementById('auth-email').value;
    const password = document.getElementById('auth-password').value;
    submit.disabled = true;
    try{
      if(authModal==='login') await doLogin(email, password);
      else{
        const name = document.getElementById('auth-name').value;
        const grade = document.getElementById('auth-grade').value;
        await doRegister(name, email, password, grade);
      }
    } finally { if(submit) submit.disabled = false; }
  });
  const sw = document.getElementById('auth-switch');
  if(sw) sw.addEventListener('click',(e)=>{ e.preventDefault(); authModal = authModal==='login'?'register':'login'; authError=''; renderModalLayer(); });
}
function genericModalHtml(){
  return `<div class="modal-bg" data-close="generic"><div class="card modal" style="position:relative">
    <button class="close-x" data-close="generic">✕</button>
    <h2>${genericModal.title}</h2>
    ${genericModal.bodyHtml}
  </div></div>`;
}
function openGenericModal(title, bodyHtml, onMount){
  genericModal = {title, bodyHtml};
  renderModalLayer();
  const holder = document.getElementById('modal-layer');
  holder.querySelectorAll('[data-close="generic"]').forEach(el=>el.addEventListener('click',(e)=>{ if(e.target===el) closeGenericModal(); }));
  if(onMount) onMount();
}
function closeGenericModal(){ genericModal=null; renderModalLayer(); }

/* ========================= HELPERS ========================= */
function catLabel(c){ return t('cat_'+c); }
function fmtLabel(f){ return t('fmt_'+f); }
function costLabel(c){
  if(c==='Free') return t('free');
  if(c==='Paid') return t('paid');
  if(c==='Partial') return t('partial');
  return c;
}
function formatDate(d){
  if(!d) return '-';
  try{ const dt = new Date(d); return dt.toLocaleDateString(LANG==='ru'?'ru-RU':'kk-KZ',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){ return d; }
}
function isSaved(oppId){ const u=currentUser(); if(!u) return false; return (ensureUserData(u.id).saved||[]).includes(oppId); }
async function toggleSave(oppId){
  if(!requireAuth()) return;
  const u = currentUser(); const ud = ensureUserData(u.id);
  ud.saved = ud.saved||[];
  const idx = ud.saved.indexOf(oppId);
  if(idx>-1){
    ud.saved.splice(idx,1); render();
    const { error } = await sb.from('saved_opportunities').delete().eq('user_id', u.id).eq('opportunity_id', oppId);
    if(error){ ud.saved.push(oppId); dbError(error); render(); }
  } else {
    ud.saved.push(oppId); if(!ud.tracker[oppId]) ud.tracker[oppId]='Saved'; render();
    const { error } = await sb.from('saved_opportunities').insert({user_id:u.id, opportunity_id:oppId});
    if(error){ ud.saved = ud.saved.filter(id=>id!==oppId); dbError(error); render(); return; }
    const { error: trackErr } = await sb.from('application_tracker').upsert({user_id:u.id, opportunity_id:oppId, status:'Saved'}, {onConflict:'user_id,opportunity_id', ignoreDuplicates:true});
    if(trackErr) dbError(trackErr);
  }
}
function isAdminUser(){ const u=currentUser(); return !!(u && u.role==='admin'); }
async function deleteOpportunity(oppId){
  const { error } = await sb.from('opportunities').delete().eq('id', oppId);
  if(error){ dbError(error); return false; }
  DB.opportunities = DB.opportunities.filter(o=>o.id!==oppId);
  Object.keys(DB.userData).forEach(uid=>{
    const ud = DB.userData[uid];
    if(ud.saved) ud.saved = ud.saved.filter(id=>id!==oppId);
    if(ud.tracker && ud.tracker[oppId]!==undefined) delete ud.tracker[oppId];
  });
  if(matchState.results) matchState.results = matchState.results.filter(r=>r.o.id!==oppId);
  return true;
}
function confirmDeleteOpportunity(oppId){
  const o = DB.opportunities.find(x=>x.id===oppId);
  openGenericModal(t('confirm_delete_title'), `<p>${t('confirm_delete_opp_text')} «${escapeHtml(o? o.title : '')}»?</p>
    <div style="display:flex;gap:10px;margin-top:14px;">
      <button class="btn btn-ghost" id="cancel-delete-opp" style="flex:1;justify-content:center;">${t('cancel')}</button>
      <button class="btn btn-danger" id="confirm-delete-opp" style="flex:1;justify-content:center;">${t('delete')}</button>
    </div>`, ()=>{
      document.getElementById('cancel-delete-opp').addEventListener('click', closeGenericModal);
      document.getElementById('confirm-delete-opp').addEventListener('click', async ()=>{
        const ok = await deleteOpportunity(oppId);
        closeGenericModal();
        renderBody();
        if(ok) showToast(t('deleted'));
      });
    });
}

function readImageResized(file, maxDim){
  return new Promise((resolve, reject)=>{
    if(!file || !file.type || file.type.indexOf('image/')!==0){ reject(new Error('not an image')); return; }
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>maxDim || h>maxDim){
          if(w>h){ h = Math.round(h*maxDim/w); w = maxDim; } else { w = Math.round(w*maxDim/h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        try{ resolve(canvas.toDataURL('image/jpeg', 0.82)); }catch(e){ reject(e); }
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

    if(exploreState.grade && !(o.grades||[]).includes(exploreState.grade)) return false;

        </select>

    </div>
    ${matchState.results? `<div style="margin-top:26px;"><div class="page-title" style="font-size:20px;">${t('match_result_title')}</div>
      <div class="grid-cards">${matchState.results.map(r=>matchCardHtml(r)).join('')}</div></div>` : ''}
  </div>`;
}
const ENG_RANK = {none:0, beginner:1, intermediate:2, advanced:3};
function computeMatches(){
  const englishRank = ENG_RANK[matchState.english] ?? 0;
  const scored = DB.opportunities.filter(o=>o.status==='approved').map(o=>{
    let score=0; let reasons=[];
    if((o.grades||[]).includes(matchState.grade)){ score+=30; reasons.push(LANG==='ru'?'подходит по классу':'сыныпқа сай'); }
    if(matchState.interests.length && matchState.interests.includes(o.category)){ score+=30; reasons.push(LANG==='ru'?'совпадает с интересами':'қызығушылыққа сай'); }
    else if(!matchState.interests.length){ score+=10; }
    if(matchState.directions.length && o.direction && matchState.directions.includes(o.direction)){ score+=20; reasons.push(LANG==='ru'?'совпадает направление':'бағыт сай келеді'); }
    else if(!matchState.directions.length){ score+=5; }
    const oppEngRank = ENG_RANK[o.englishLevel] ?? 0;
    if(oppEngRank<=englishRank){ score+=15; reasons.push(LANG==='ru'?'уровень английского подходит':'ағылшын деңгейі сәйкес'); }
    else{ score-=10; }
    if(matchState.format && o.format===matchState.format){ score+=15; reasons.push(LANG==='ru'?'нужный формат':'қажетті формат'); }
    else if(!matchState.format){ score+=5; }
    if(matchState.budget==='free' && o.cost==='Free'){ score+=10; reasons.push(LANG==='ru'?'бесплатно':'тегін'); }
    else if(matchState.budget==='free' && o.cost!=='Free'){ score-=25; }
    else if(matchState.budget==='low' && o.cost!=='Paid'){ score+=8; }
    score = Math.max(0, Math.min(100, score+10));
    return {o, score, reasons};
  }).sort((a,b)=>b.score-a.score).slice(0,5);
  return scored;
}
function matchCardHtml(r){
  return `<div class="card match-card">
    <div class="pill">${catLabel(r.o.category)}</div>
    <div class="opp-title">${escapeHtml(r.o.title)}</div>
    <div class="match-pct">${bulbSVG({size:18,cls:'match-bulb '+(r.score>=70?'bulb-lit':'bulb-dim')})}${r.score}% <span style="font-size:12px;color:var(--muted);font-weight:600;">${t('match_pct')}</span></div>
    <div class="progressbar"><div class="progressbar-fill" style="width:${r.score}%;"></div></div>
    <div class="mini">${t('why_match')}: ${r.reasons.join(', ')||'-'}</div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-outline btn-sm" data-view="${r.o.id}">${t('view_details')}</button>
      ${isAdminUser()? `<button class="btn btn-danger btn-sm" data-deleteopp="${r.o.id}" title="${t('delete')}">🗑</button>` : ''}
    </div>
  </div>`;
}
function bindMatchEvents(){
  const g = document.getElementById('mq-grade'); if(g) g.addEventListener('change',()=>matchState.grade=g.value);
  document.querySelectorAll('.mq-interest').forEach(cb=>cb.addEventListener('change',()=>{
    matchState.interests = Array.from(document.querySelectorAll('.mq-interest:checked')).map(c=>c.value);
  }));
  document.querySelectorAll('.mq-direction').forEach(cb=>cb.addEventListener('change',()=>{
    matchState.directions = Array.from(document.querySelectorAll('.mq-direction:checked')).map(c=>c.value);
  }));
  const e = document.getElementById('mq-english'); if(e) e.addEventListener('change',()=>matchState.english=e.value);
  const f = document.getElementById('mq-format'); if(f) f.addEventListener('change',()=>matchState.format=f.value);
  const b = document.getElementById('mq-budget'); if(b) b.addEventListener('change',()=>matchState.budget=b.value);
  const sub = document.getElementById('mq-submit'); if(sub) sub.addEventListener('click', ()=>{ matchState.results = computeMatches(); renderBody(); });
  // note: [data-view] buttons on match cards are already bound globally by bindOppCardEvents(document)
}

/* ---- Add Opportunity (modal-driven, manual + link) ---- */
let addOppState = {mode:'manual', draft:null, sourceUrl:''};
function blankDraft(){ return {title:'',description:'',organizer:'',deadline:'',category:CATEGORIES[0],direction:'other',grades:[],location:'',format:'online',cost:'Free',scholarship:false,englishLevel:'none',requirements:'',steps:'',website:''}; }

function openAddOpportunityModal(){
  addOppState = {mode:'manual', draft:blankDraft(), sourceUrl:''};
  openGenericModal(t('add_opportunity'), addOppBodyHtml(), bindAddOppEvents);
}
function addOppBodyHtml(){
  return `<div class="linktabs">
    <button data-mode="manual" class="${addOppState.mode==='manual'?'active':''}">${t('add_manually')}</button>
    <button data-mode="link" class="${addOppState.mode==='link'?'active':''}">${t('add_by_link')}</button>
  </div>
  <div id="add-opp-inner">${addOppState.mode==='link'? addOppLinkHtml() : addOppFormHtml()}</div>`;
}
function addOppLinkHtml(){
  if(!addOppState.showForm){
    return `<div class="field"><label>${t('link_input')}</label><input type="text" id="link-url" value="${escapeHtml(addOppState.sourceUrl)}" placeholder="https://..."></div>
    <div class="helper-text">${LANG==='ru'?'Вставь ссылку на страницу программы, затем заполни детали вручную ниже.':'Бағдарлама бетінің сілтемесін қой, содан кейін төменде толтыр.'}</div>
    <button class="btn btn-primary" id="continue-link-btn" style="width:100%;justify-content:center;">${LANG==='ru'?'Продолжить':'Жалғастыру'}</button>`;
  }
  return addOppFormHtml();
}
function addOppFormHtml(){
  const d = addOppState.draft || blankDraft();
  return `<p class="helper-text">${t('review_edit')}</p>
  <div class="form-grid">
    <div class="field"><label>${t('title_label')}*</label><input type="text" id="d-title" value="${escapeHtml(d.title)}"></div>
    <div class="field"><label>${t('opp_organizer')}</label><input type="text" id="d-organizer" value="${escapeHtml(d.organizer)}"></div>
    <div class="field"><label>${t('deadline')}</label><input type="date" id="d-deadline" value="${d.deadline||''}"></div>
    <div class="field"><label>${t('category_label')}</label><select id="d-category">${CATEGORIES.map(c=>`<option value="${c}" ${d.category===c?'selected':''}>${catLabel(c)}</option>`).join('')}</select></div>
    <div class="field"><label>${t('direction_label')}</label><select id="d-direction">${DIRECTIONS.map(dr=>`<option value="${dr}" ${d.direction===dr?'selected':''}>${t('direction_'+dr)}</option>`).join('')}</select></div>
    <div class="field"><label>${t('grades_label')}</label>
      <div class="tag-row">${GRADES.map(g=>`<label style="display:flex;gap:4px;align-items:center;background:var(--border);padding:4px 8px;border-radius:8px;"><input type="checkbox" class="d-grade" value="${g}" ${(d.grades||[]).includes(g)?'checked':''}>${g}</label>`).join('')}</div>
    </div>
    <div class="field"><label>${t('opp_location')}</label><input type="text" id="d-location" value="${escapeHtml(d.location)}"></div>
    <div class="field"><label>${t('format_label')}</label><select id="d-format">${FORMATS.map(f=>`<option value="${f}" ${d.format===f?'selected':''}>${fmtLabel(f)}</option>`).join('')}</select></div>
    <div class="field"><label>${t('cost_label')}</label><select id="d-cost"><option value="Free" ${d.cost==='Free'?'selected':''}>${t('free')}</option><option value="Paid" ${d.cost==='Paid'?'selected':''}>${t('paid')}</option><option value="Partial" ${d.cost==='Partial'?'selected':''}>${t('partial')}</option></select></div>
    <div class="field"><label>${t('opp_english')}</label><select id="d-english">${ENGLISH_LEVELS.map(l=>`<option value="${l}" ${d.englishLevel===l?'selected':''}>${l}</option>`).join('')}</select></div>
    <div class="field"><label>${t('opp_website')}</label><input type="text" id="d-website" value="${escapeHtml(d.website)}"></div>
  </div>
  <div class="field"><label>${t('description_label')}</label><textarea id="d-description" rows="3">${escapeHtml(d.description)}</textarea></div>
  <div class="field"><label>${t('opp_requirements')}</label><textarea id="d-requirements" rows="2">${escapeHtml(d.requirements)}</textarea></div>
  <div class="field"><label>${t('opp_steps')} (${LANG==='ru'?'по одному на строку':'әр жолда біреуден'})</label><textarea id="d-steps" rows="3">${escapeHtml(Array.isArray(d.steps)? d.steps.join('\\n') : (d.steps||''))}</textarea></div>
  <button class="btn btn-primary" id="submit-draft-btn" style="width:100%;justify-content:center;">${t('submit_for_review')}</button>`;
}
function readDraftFromForm(){
  const grades = Array.from(document.querySelectorAll('.d-grade:checked')).map(c=>c.value);
  return {
    title: document.getElementById('d-title').value.trim(),
    organizer: document.getElementById('d-organizer').value.trim(),
    deadline: document.getElementById('d-deadline').value,
    category: document.getElementById('d-category').value,
    direction: document.getElementById('d-direction').value,
    grades,
    location: document.getElementById('d-location').value.trim(),
    format: document.getElementById('d-format').value,
    cost: document.getElementById('d-cost').value,
    englishLevel: document.getElementById('d-english').value,
    website: document.getElementById('d-website').value.trim(),
    description: document.getElementById('d-description').value.trim(),
    requirements: document.getElementById('d-requirements').value.trim(),
    steps: document.getElementById('d-steps').value.split('\\n').map(s=>s.trim()).filter(Boolean)
  };
}
function bindAddOppEvents(){
  const holder = document.getElementById('modal-layer');
  holder.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click', ()=>{
    addOppState.mode = b.dataset.mode; addOppState.showForm=false;
    if(addOppState.mode==='manual') addOppState.draft = addOppState.draft && addOppState.draft.title!==undefined ? addOppState.draft : blankDraft();
    refreshAddOppInner();
  }));
  wireAddOppInner();
}
function refreshAddOppInner(){
  document.getElementById('add-opp-inner').innerHTML = addOppState.mode==='link' ? addOppLinkHtml() : addOppFormHtml();
  document.querySelectorAll('.linktabs button').forEach(b=>b.classList.toggle('active', b.dataset.mode===addOppState.mode));
  wireAddOppInner();
}
function wireAddOppInner(){
  const continueBtn = document.getElementById('continue-link-btn');
  if(continueBtn) continueBtn.addEventListener('click', ()=>{
    addOppState.sourceUrl = document.getElementById('link-url').value.trim();
    if(!addOppState.draft) addOppState.draft = blankDraft();
    if(!addOppState.draft.website) addOppState.draft.website = addOppState.sourceUrl;
    addOppState.showForm = true;
    refreshAddOppInner();
  });
  const submitBtn = document.getElementById('submit-draft-btn');
  if(submitBtn) submitBtn.addEventListener('click', async ()=>{
    const draft = readDraftFromForm();
    if(!draft.title){ showToast(t('fill_required')); return; }
    const u = currentUser();
    submitBtn.disabled = true;
    const { data, error } = await sb.from('submissions').insert({
      user_id: u.id, draft, source_url: addOppState.mode==='link'? addOppState.sourceUrl : null
    }).select().single();
    submitBtn.disabled = false;
    if(error){ dbError(error); return; }
    DB.submissions.unshift(mapSubmissionFromDb(data));
    closeGenericModal();
    showToast(LANG==='ru'?'Отправлено на модерацию!':'Модерацияға жіберілді!');
  });
}

/* ---- Admin ---- */
let adminTab = 'pending';
function pageAdmin(){
  const u = currentUser();
  if(!u) return `<div class="wrap section">${emptyStateHtml(t('login_required'))}</div>`;
  if(u.role!=='admin') return `<div class="wrap section">${emptyStateHtml(t('admin_only'))}</div>`;
  const subs = DB.submissions;
  const counts = {
    pending: subs.filter(s=>s.status==='pending').length,
    approved: subs.filter(s=>s.status==='approved').length,
    rejected: subs.filter(s=>s.status==='rejected').length,
    total: subs.length
  };
  const list = subs.filter(s=>s.status===adminTab || adminTab==='all').slice().sort((a,b)=>b.createdAt-a.createdAt);
  return `<div class="wrap section">
    <div class="page-title">${t('admin_title')}</div><div class="page-sub">${t('admin_sub')}</div>
    <div class="stat-grid" style="grid-template-columns:repeat(4,1fr);">
      <div class="card stat-box"><div class="stat-num">${counts.pending}</div><div class="mini">${t('pending')}</div></div>
      <div class="card stat-box"><div class="stat-num">${counts.approved}</div><div class="mini">${t('approved')}</div></div>
      <div class="card stat-box"><div class="stat-num">${counts.rejected}</div><div class="mini">${t('rejected')}</div></div>
      <div class="card stat-box"><div class="stat-num">${counts.total}</div><div class="mini">${t('total')}</div></div>
    </div>
    <div class="tabbar">
      ${['pending','approved','rejected','all','mentors','temirtau','posts','programs'].map(k=>`<button data-atab="${k}" class="${adminTab===k?'active':''}">${k==='all'? t('all') : k==='mentors'? t('nav_mentors') : k==='temirtau'? t('nav_temirtau') : k==='posts'? t('posts_title') : k==='programs'? t('programs_tab_label') : t(k)}</button>`).join('')}
    </div>
    ${adminTab==='mentors' ? adminMentorsHtml() : adminTab==='temirtau' ? adminTemirtauHtml() : adminTab==='posts' ? adminPostsHtml() : adminTab==='programs' ? adminProgramsHtml() : (list.length? `<div class="scroll-x"><table class="admin-table"><thead><tr>
      <th>${t('title_label')}</th><th>${t('category_label')}</th><th>${t('submitted_by')}</th><th>${t('source_link')}</th><th>${t('tracker_status')}</th><th></th>
    </tr></thead><tbody>
      ${list.map(s=>{
        const submitter = DB.users[s.userId];
        return `<tr>
          <td>${escapeHtml(s.draft.title)}</td>
          <td>${catLabel(s.draft.category)}</td>
          <td>${submitter? escapeHtml(submitter.name) : '-'}</td>
          <td>${s.sourceUrl? `<a href="${s.sourceUrl}" target="_blank" style="color:var(--accent-dark);">🔗</a>` : '-'}</td>
          <td><span class="status-tag status-${s.status}">${t('status_'+s.status)}</span>${s.status==='rejected'&&s.rejectionReason? `<div class="mini">${escapeHtml(s.rejectionReason)}</div>`:''}</td>
          <td style="white-space:nowrap;">
            <button class="btn btn-ghost btn-sm" data-detail="${s.id}">👁</button>
            ${s.status==='pending'? `<button class="btn btn-success btn-sm" data-approve="${s.id}">${t('approve')}</button>
            <button class="btn btn-danger btn-sm" data-reject="${s.id}">${t('reject')}</button>` : ''}
          </td>
        </tr>`;
      }).join('')}
    </tbody></table></div>` : emptyStateHtml('—'))}
  </div>`;
}

function bindAdminEvents(){
  document.querySelectorAll('[data-atab]').forEach(b=>b.addEventListener('click',()=>{ adminTab=b.dataset.atab; renderBody(); }));
  const addProgramBtn = document.getElementById('add-program-btn');
  if(addProgramBtn) addProgramBtn.addEventListener('click', async ()=>{
    const title = document.getElementById('ap-title').value.trim();
    if(!title){ showToast(t('fill_required')); return; }
    const grades = Array.from(document.querySelectorAll('.ap-grade:checked')).map(c=>c.value);
    const steps = document.getElementById('ap-steps').value.split('\n').map(s=>s.trim()).filter(Boolean);
    const newOpp = {
      title,
      organizer: document.getElementById('ap-organizer').value.trim(),
      deadline: document.getElementById('ap-deadline').value || null,
      category: document.getElementById('ap-category').value,
      direction: document.getElementById('ap-direction').value,
      grades,
      location: document.getElementById('ap-location').value.trim(),
      format: document.getElementById('ap-format').value,
      cost: document.getElementById('ap-cost').value,
      englishLevel: document.getElementById('ap-english').value,
      website: document.getElementById('ap-website').value.trim(),
      description: document.getElementById('ap-description').value.trim(),
      requirements: document.getElementById('ap-requirements').value.trim(),
      steps
    };
    addProgramBtn.disabled = true;
    const { data, error } = await sb.from('opportunities').insert(opportunityToDbRow(newOpp)).select().single();
    addProgramBtn.disabled = false;
    if(error){ dbError(error); return; }
    DB.opportunities.unshift(mapOpportunityFromDb(data));
    renderBody(); showToast(t('add_program'));
  });
  document.querySelectorAll('[data-approve]').forEach(b=>b.addEventListener('click', async ()=>{
    const s = DB.submissions.find(x=>x.id===b.dataset.approve);
    const insertRes = await sb.from('opportunities').insert(Object.assign(opportunityToDbRow(s.draft), {source_url:s.sourceUrl})).select().single();
    if(insertRes.error){ dbError(insertRes.error); return; }
    const updRes = await sb.from('submissions').update({status:'approved'}).eq('id', s.id);
    if(updRes.error){ dbError(updRes.error); return; }
    s.status='approved';
    DB.opportunities.unshift(mapOpportunityFromDb(insertRes.data));
    renderBody(); showToast(LANG==='ru'?'Одобрено':'Мақұлданды');
  }));
  document.querySelectorAll('[data-reject]').forEach(b=>b.addEventListener('click',()=>{
    const s = DB.submissions.find(x=>x.id===b.dataset.reject);
    openGenericModal(t('reject'), `<div class="field"><label>${t('rejection_reason')}</label><textarea id="reject-reason" rows="3" placeholder="${t('reason_placeholder')}"></textarea></div>
      <button class="btn btn-danger" id="reject-confirm" style="width:100%;justify-content:center;">${t('reject')}</button>`, ()=>{
        document.getElementById('reject-confirm').addEventListener('click', async ()=>{
          const reason = document.getElementById('reject-reason').value;
          const { error } = await sb.from('submissions').update({status:'rejected', rejection_reason:reason}).eq('id', s.id);
          if(error){ dbError(error); return; }
          s.status='rejected'; s.rejectionReason = reason;
          closeGenericModal(); renderBody();
        });
      });
  }));
  const addMentorBtn = document.getElementById('add-mentor-btn');
  if(addMentorBtn) addMentorBtn.addEventListener('click', async ()=>{
    const name = document.getElementById('nm-name').value.trim();
    const expertise = Array.from(document.querySelectorAll('.nm-exp:checked')).map(c=>c.value);
    const bioRu = document.getElementById('nm-bio-ru').value.trim();
    const bioKz = document.getElementById('nm-bio-kz').value.trim();
    if(!name || !expertise.length){ showToast(t('fill_required')); return; }
    addMentorBtn.disabled = true;
    const { data, error } = await sb.from('mentors').insert({name, expertise, bio_ru:bioRu, bio_kz:bioKz}).select().single();
    addMentorBtn.disabled = false;
    if(error){ dbError(error); return; }
    DB.mentors.push(mapMentorFromDb(data));
    renderBody(); showToast(t('add_mentor'));
  });
  document.querySelectorAll('[data-delmentor]').forEach(b=>b.addEventListener('click', async ()=>{
    const { error } = await sb.from('mentors').delete().eq('id', b.dataset.delmentor);
    if(error){ dbError(error); return; }
    DB.mentors = DB.mentors.filter(m=>m.id!==b.dataset.delmentor);
    renderBody();
  }));
  const saveTemirtauBtn = document.getElementById('save-temirtau-btn');
  if(saveTemirtauBtn) saveTemirtauBtn.addEventListener('click', async ()=>{
    const students = parseInt(document.getElementById('tt-students').value, 10);
    const mentorsCount = parseInt(document.getElementById('tt-mentors').value, 10);
    const newStats = {
      students: isNaN(students) ? 0 : Math.max(0, students),
      mentors: isNaN(mentorsCount) ? 0 : Math.max(0, mentorsCount)
    };
    const { error } = await sb.from('temirtau_stats').update(newStats).eq('id', 1);
    if(error){ dbError(error); return; }
    DB.temirtauStats = newStats;
    showToast(t('save_changes'));
  });
  const addPostBtn = document.getElementById('add-post-btn');
  if(addPostBtn) addPostBtn.addEventListener('click', async ()=>{
    const title = document.getElementById('np-title').value.trim();
    const body = document.getElementById('np-body').value.trim();
    const type = document.getElementById('np-type').value;
    if(!title || !body){ showToast(t('fill_required')); return; }
    let image = null;
    const fileInput = document.getElementById('np-image');
    addPostBtn.disabled = true;
    if(fileInput && fileInput.files && fileInput.files[0]){
      try{ image = await readImageResized(fileInput.files[0], 900); }
      catch(e){ console.error(e); }
    }
    const { data, error } = await sb.from('posts').insert({title, body, type, image, author_id:currentUser().id}).select().single();
    addPostBtn.disabled = false;
    if(error){ dbError(error); return; }
    DB.posts.unshift(mapPostFromDb(data));
    renderBody(); showToast(t('publish_post'));
  });
  const npImage = document.getElementById('np-image');
  if(npImage) npImage.addEventListener('change', async ()=>{
    const preview = document.getElementById('np-image-preview');
    if(npImage.files && npImage.files[0]){
      try{
        const dataUrl = await readImageResized(npImage.files[0], 900);
        preview.src = dataUrl; preview.style.display = 'block';
      }catch(e){ preview.style.display = 'none'; }
    } else { preview.style.display = 'none'; }
  });
  document.querySelectorAll('[data-delpost]').forEach(b=>b.addEventListener('click', async ()=>{
    const { error } = await sb.from('posts').delete().eq('id', b.dataset.delpost);
    if(error){ dbError(error); return; }
    DB.posts = DB.posts.filter(p=>p.id!==b.dataset.delpost);
    renderBody();
  }));
  document.querySelectorAll('[data-detail]').forEach(b=>b.addEventListener('click',()=>{
    const s = DB.submissions.find(x=>x.id===b.dataset.detail);
    const d = s.draft;
    openGenericModal(d.title, `
      <div class="mini">${catLabel(d.category)} · ${formatDate(d.deadline)} · ${(d.grades||[]).join(', ')}</div>
      <p style="margin-top:10px;">${escapeHtml(d.description)}</p>
      <p><b>${t('opp_requirements')}:</b> ${escapeHtml(d.requirements||'-')}</p>
      ${d.steps&&d.steps.length? `<b>${t('opp_steps')}:</b><ol>${d.steps.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ol>`:''}
      <p><b>${t('opp_website')}:</b> ${d.website||'-'}</p>
      <p><b>${t('source_link')}:</b> ${s.sourceUrl||'-'}</p>
    `);
  }));
}

/* ========================= RENDER ROOT ========================= */
function pageContent(){
  switch(route.name){
    case 'home': return pageHome();
    case 'explore': return pageExplore();
    case 'opportunity': return pageOpportunity();
    case 'match': return pageMatch();
    case 'mentors': return pageMentors();
    case 'glossary': return pageGlossary();
    case 'calendar': return pageCalendar();
    case 'temirtau': return pageTemirtau();
    case 'myzharyk': return pageMyZharyk();
    case 'admin': return pageAdmin();
    default: return pageHome();
  }
}
function bindPageEvents(){
  bindOppCardEvents(document);
  document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click', ()=>go(b.dataset.nav)));
  switch(route.name){
    case 'explore': bindExploreEvents(); break;
    case 'opportunity': bindOpportunityEvents(); break;
    case 'match': bindMatchEvents(); break;
    case 'mentors': bindMentorsEvents(); break;
    case 'glossary': bindGlossaryEvents(); break;
    case 'calendar': bindCalendarEvents(); break;
    case 'myzharyk': bindMyZharykEvents(); break;
    case 'admin': bindAdminEvents(); break;
  }
}
function renderBody(){
  document.getElementById('page-body').innerHTML = pageContent();
  bindPageEvents();
}
function render(){
  document.title = t('app_name')+' — '+ (route.name);
  document.getElementById('root').innerHTML = `
    ${renderTopbar()}
    <div id="page-body">${pageContent()}</div>
    <div class="footer">Zharyk</div>
  `;
  bindTopbarEvents();
  bindPageEvents();
  renderModalLayer();
}

/* ========================= INIT ========================= */
function unconfiguredScreenHtml(){
  return `<div class="center" style="height:100vh;padding:24px;">
    <div class="card" style="max-width:520px;padding:28px;text-align:center;">
      <div class="empty-bulb" style="margin:0 auto 14px;">${bulbSVG({size:30})}</div>
      <h2 style="margin-top:0;">Supabase не настроен</h2>
      <p class="mini" style="text-align:left;line-height:1.6;">
        Открой файл <code>zharyk.html</code> и в начале &lt;script&gt; впиши свои
        <b>SUPABASE_URL</b> и <b>SUPABASE_ANON_KEY</b> (Project Settings → API в Supabase),
        предварительно выполнив <code>zharyk_supabase_schema.sql</code> в SQL Editor.
      </p>
    </div>
  </div>`;
}
async function init(){
  document.getElementById('root').innerHTML = `<div class="center" style="height:100vh;font-weight:700;">Loading Zharyk<span class="loading-dots"></span></div>`;
  if(!sb){
    document.getElementById('root').innerHTML = unconfiguredScreenHtml();
    return;
  }
  const { data: sessionData } = await sb.auth.getSession();
  SESSION_USER_ID = sessionData && sessionData.session ? sessionData.session.user.id : null;
  SESSION_USER_EMAIL = sessionData && sessionData.session && sessionData.session.user
    ? (sessionData.session.user.email || '').toLowerCase()
    : null;
  await refreshAllData();

  sb.auth.onAuthStateChange((event, session)=>{
    const newId = session ? session.user.id : null;
    if(newId === SESSION_USER_ID) return; // avoid redundant refresh loops on token refresh events
    SESSION_USER_ID = newId;
    refreshAllData().then(render);
  });

  route = parseHash();
  render();
}
init();
</script>
